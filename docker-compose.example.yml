services:
  sub2api-usage-keeper:
    image: sub2api-usage-keeper:latest
    container_name: sub2api-usage-keeper
    restart: unless-stopped
    environment:
      SUB2API_DATABASE_URL: postgres://sub2api:${SUB2API_POSTGRES_PASSWORD}@sub2api-postgres:5432/sub2api?sslmode=disable
      APP_PORT: "8080"
      TZ: Asia/Shanghai
      WORK_DIR: /data
    volumes:
      - ./usage-dashboard/data:/data
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - sub2api-network

networks:
  sub2api-network:
    external: true
