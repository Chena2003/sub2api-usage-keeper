services:
  sub2api-usage-keeper:
    image: sub2api-usage-keeper:latest
    container_name: sub2api-usage-keeper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内数据目录固定为挂载卷路径，覆盖 .env 中的相对路径默认值。
      WORK_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - sub2api-network

networks:
  sub2api-network:
    external: true
